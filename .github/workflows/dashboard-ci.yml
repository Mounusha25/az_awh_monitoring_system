name: Dashboard CI

on:
  push:
    paths: ['awh_az/water-station-dashboard/**', '.github/workflows/dashboard-ci.yml']
  pull_request:
    paths: ['awh_az/water-station-dashboard/**', '.github/workflows/dashboard-ci.yml']

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: awh_az/water-station-dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: awh_az/water-station-dashboard/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
