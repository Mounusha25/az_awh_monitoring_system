name: Backend CI

on:
  push:
    paths:
      - 'awh_az/backend/**'
      - 'ingestion_worker.py'
      - 'test_ingestion_worker.py'
      - 'scripts/**'
      - 'cloud_functions/**'
      - 'awh_az/water-station-dashboard/src/lib/api-client.ts'  # contract tests compare it with the backend
      - 'RPi_USB_Package/cloud_uploader.py'
      - 'RPi_USB_Package/test_cloud_uploader.py'
      - 'RPi_USB_Package/test_station_wiring.py'
      - 'RPi_USB_Package/AquaPars1.py'
      - 'RPi_USB_Package/AquaPars1_new_pm.py'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    paths:
      - 'awh_az/backend/**'
      - 'ingestion_worker.py'
      - 'test_ingestion_worker.py'
      - 'scripts/**'
      - 'cloud_functions/**'
      - 'awh_az/water-station-dashboard/src/lib/api-client.ts'  # contract tests compare it with the backend
      - 'RPi_USB_Package/cloud_uploader.py'
      - 'RPi_USB_Package/test_cloud_uploader.py'
      - 'RPi_USB_Package/test_station_wiring.py'
      - 'RPi_USB_Package/AquaPars1.py'
      - 'RPi_USB_Package/AquaPars1_new_pm.py'
      - '.github/workflows/backend-ci.yml'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'   # matches awh_az/backend/Dockerfile
          cache: pip
          cache-dependency-path: awh_az/backend/requirements.txt
      # The ingestion worker's imports (firebase-admin, psycopg2, dotenv) are
      # all covered by the backend requirements, so one install serves both.
      - run: pip install -r awh_az/backend/requirements.txt pytest httpx ruff   # httpx: FastAPI TestClient
      # Syntax errors and undefined names only — catches real breakage without
      # failing on style the codebase hasn't adopted.
      - run: ruff check --select E9,F63,F7,F82 awh_az/backend scripts ingestion_worker.py test_ingestion_worker.py cloud_functions RPi_USB_Package/cloud_uploader.py RPi_USB_Package/test_cloud_uploader.py RPi_USB_Package/test_station_wiring.py RPi_USB_Package/AquaPars1.py RPi_USB_Package/AquaPars1_new_pm.py --exclude awh_az/backend/venv
      - run: python -m compileall -q awh_az/backend/main.py awh_az/backend/models.py awh_az/backend/config.py awh_az/backend/cache.py awh_az/backend/datadownload.py awh_az/backend/logging_config.py ingestion_worker.py RPi_USB_Package/cloud_uploader.py RPi_USB_Package/AquaPars1.py RPi_USB_Package/AquaPars1_new_pm.py
      - run: python -m pytest test_ingestion_worker.py awh_az/backend/tests scripts RPi_USB_Package/test_cloud_uploader.py RPi_USB_Package/test_station_wiring.py -v
      # The Cloud Function's main.py has the same module name as the backend's, so it needs its own pytest run.
      - run: pip install -r cloud_functions/receive_data/requirements.txt
      - run: python -m pytest cloud_functions -v

  # Render builds this same Dockerfile; failing here is cheaper than failing there.
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t awh-backend awh_az/backend
